{% extends "base.html" %}

{% block title %}Error {{ code or '' }} - Agro-Vision AI{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm p-4 rounded-4">
            <div class="card-body">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
                <h2 class="mt-3 fw-bold">{{ code or 'Notice' }}</h2>
                <p class="lead text-muted fs-6 mb-4">{{ message or 'An unexpected issue occurred.' }}</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-success tap-target px-4">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
